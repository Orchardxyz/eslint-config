name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or SHA to publish from for backfills.
        required: false
      expected_version:
        description: Optional safety check for the version in package.json.
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'Version Packages') ||
      contains(github.event.head_commit.message, 'changeset-release/main')
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: |
          npm install --global npm@latest
          hash -r
          which node
          node --version
          which npm
          npm --version

      - name: Verify npm CLI baseline
        run: node ./scripts/verify-npm-baseline.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks before publish
        run: pnpm check

      - name: Resolve release context
        id: release_context
        env:
          EXPECTED_VERSION: ${{ github.event.inputs.expected_version || '' }}
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          package_name="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")"
          commit_sha="$(git rev-parse HEAD)"
          prerelease=false
          already_published=false

          if [ -z "$package_name" ] || [ -z "$version" ]; then
            echo "Unable to read package name and version from package.json." >&2
            exit 1
          fi

          if [ -n "$EXPECTED_VERSION" ] && [ "$EXPECTED_VERSION" != "$version" ]; then
            echo "Expected package.json version $EXPECTED_VERSION, but found $version." >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          stdout_file="$(mktemp)"
          stderr_file="$(mktemp)"

          if npm view "${package_name}@${version}" version >"$stdout_file" 2>"$stderr_file"; then
            published_version="$(tr -d '\r\n' <"$stdout_file")"
            if [ "$published_version" = "$version" ]; then
              already_published=true
            fi
          else
            if ! grep -Eiq 'E404|404 Not Found|No match found' "$stderr_file"; then
              cat "$stderr_file" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "already_published=$already_published" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          if [ "$already_published" = true ]; then
            echo "Package ${package_name}@${version} is already published."
          else
            echo "Package ${package_name}@${version} is ready to publish from ${commit_sha}."
          fi

      - name: Publish package to npm
        if: steps.release_context.outputs.already_published != 'true'
        run: pnpm release

      - name: Extract release notes
        id: release_notes
        run: |
          version="$(node ./scripts/write-release-notes.mjs)"
          if [ -z "$version" ]; then
            echo "Unable to determine release version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_context.outputs.version }}
          name: v${{ steps.release_context.outputs.version }}
          target_commitish: ${{ steps.release_context.outputs.commit_sha }}
          body_path: .release-notes.md
          prerelease: ${{ steps.release_context.outputs.prerelease == 'true' }}
