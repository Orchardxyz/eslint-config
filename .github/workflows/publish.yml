name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, 'changeset-release/main')
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: |
          npm install --global npm@latest
          hash -r
          which node
          node --version
          which npm
          npm --version

      - name: Verify npm CLI baseline
        run: node ./scripts/verify-npm-baseline.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks before publish
        run: pnpm check

      - name: Publish package to npm
        run: pnpm release

      - name: Extract release notes
        id: release_notes
        run: |
          echo "version=$(node ./scripts/write-release-notes.mjs)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_notes.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: .release-notes.md
