name: Publish

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  publish:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - name: Check out merged release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm trusted-publisher baseline
        run: |
          npm install --global npm@11.5.1
          hash -r
          which node
          node --version
          which npm
          npm --version

      - name: Verify npm CLI baseline
        run: node ./scripts/verify-npm-baseline.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks before publish
        run: pnpm check

      - name: Publish package to npm
        run: pnpm release

      - name: Extract release notes
        id: release_notes
        run: |
          echo "version=$(node ./scripts/write-release-notes.mjs)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_notes.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          body_path: .release-notes.md
